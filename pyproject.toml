[project]
name = "sonu"
version = "0.1.0.dev0"
description = "SONU (System-Oriented Neural Utility): a local-first, privacy-first AI operator for the Linux desktop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Martin" }]
requires-python = ">=3.12"
keywords = ["agent", "assistant", "hyprland", "wayland", "ollama", "linux", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Typing :: Typed",
]
# Keep runtime dependencies few: every one of them is supply-chain surface (see docs/threat-model.md).
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "rich>=15.0.0,<16",
    "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/thomasmartinoa/SONU"
Issues = "https://github.com/thomasmartinoa/SONU/issues"

[project.scripts]
sonu = "sonu.cli.entry:main"

[project.optional-dependencies]
# Talking to SONU (M3): speech recognition on the GPU and a local voice. Big (~2.6 GB with the CUDA
# libraries), so optional: `uv sync --extra voice`, or install SONU with `sonu[voice]`.
voice = [
    "faster-whisper>=1.2,<2",
    "kokoro-onnx>=0.6,<1",
    "nvidia-cublas-cu12>=12.9,<13",   # CTranslate2's CUDA 12 math library (the system has CUDA 13)
    "nvidia-cudnn-cu12>=9.26,<10",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonu"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "S",             # bandit (security)
    "PTH",           # prefer pathlib
    "ASYNC",         # async pitfalls
    "C4",            # comprehensions
    "PIE",
    "RET",
    "TID",
]
ignore = [
    "S603",  # subprocess without shell: we always pass argv lists; S603 flags every call
    "S607",  # partial executable path: tools are resolved via PATH on purpose (grim, nvidia-smi, ...)
]

# Symbols used on purpose in terminal output and prose.
allowed-confusables = ["ℹ", "–", "·", "→", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# The optional voice engines (the `voice` extra) ship without usable type information.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "kokoro_onnx", "kokoro_onnx.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# numpy comes only with the optional voice extra; CI installs without it (found on CI: every run since
# #21 failed here). With the extra installed, its own types are used.
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "hyprland: needs a real, running Hyprland session (opt-in: pytest -m hyprland)",
    "ollama: needs a real, running Ollama server (opt-in: pytest -m ollama)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sonu"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
