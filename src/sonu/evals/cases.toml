# ---- found on the owner's laptop trying batch 1 (v6)

[[case]]
id = "dnd-off-keeps-notifications"
request = "turn off night light and turn off do not disturb"
notes = "Found on real hardware: 'turn off do not disturb' cleared the notifications instead."
system = { shell = { nightlight = "on", caffeine = "off", dnd = "true", lock = "unlocked" } }
expect_status = ["done"]
expect_system = { night_light = "off", do_not_disturb = false, notifications = 3 }

[[case]]
id = "how-is-my-laptop"
request = "how is my laptop doing?"
notes = "Found on real hardware: answered with volume, brightness and Wi-Fi instead of the laptop's health."
expect_status = ["done"]
require_tools = ["system.status"]
expect_reply_contains = "CPU temperature: 61"

[[case]]
id = "play-with-a-title-on-screen"
request = "play faded on youtube in chromium"
notes = "Found on real hardware: the query was copied from Zen's window title and refused."
windows = [{ class = "zen", title = "Alan Walker - Faded - YouTube — Zen Browser", workspace = 1, focused = true }]
expect_status = ["done"]
expect_windows = [{ class = "chromium", title_contains = "youtube.com/watch" }]
expect_system = { videos_playing = 1 }
require_tools = ["media.play"]

[[case]]
id = "song-in-a-browser-without-media-controls"
request = "play lofi beats in chromium"
notes = "Found on real hardware: Chromium plays but isn't in the media controls; SONU must hear it (PipeWire)."
system = { browser_mpris = false, browser_autoplay = true }
expect_status = ["done"]
expect_windows = [{ class = "chromium", title_contains = "youtube.com/watch" }]
expect_system = { videos_playing = 1 }
require_tools = ["media.play"]

[[case]]
id = "play-in-the-named-browser"
request = "play lofi on youtube in chromium"
notes = "Found on real hardware: 'in firefox' was left out of the plan and the video played in Zen."
expect_status = ["done"]
expect_windows = [{ class = "chromium", title_contains = "youtube.com/watch" }]
expect_absent = ["zen"]
require_tools = ["media.play"]


# ---- capability batch 2: window states and side by side (v7)

[[case]]
id = "fullscreen-this-window"
request = "make this window fullscreen"
windows = [{ class = "kitty", title = "zsh", workspace = 1, focused = true }]
expect_status = ["done"]
expect_windows = [{ class = "kitty", fullscreen = 2 }]
require_tools = ["windows.state"]

[[case]]
id = "exit-fullscreen"
request = "exit fullscreen"
windows = [{ class = "zen", title = "YouTube — Zen Browser", workspace = 1, focused = true, fullscreen = 2 }]
expect_status = ["done"]
expect_windows = [{ class = "zen", fullscreen = 0 }]
require_tools = ["windows.state"]

[[case]]
id = "maximize-this-window"
request = "maximize this window"
notes = "Found on real hardware: planned as fullscreen."
windows = [{ class = "kitty", title = "zsh", workspace = 1, focused = true }]
expect_status = ["done"]
expect_windows = [{ class = "kitty", fullscreen = 1 }]
require_tools = ["windows.state"]

[[case]]
id = "float-a-window"
request = "make kitty float"
windows = [{ class = "kitty", title = "zsh", workspace = 1, focused = true }, { class = "zen", title = "Zen Browser", workspace = 1 }]
expect_status = ["done"]
expect_windows = [{ class = "kitty", floating = true }, { class = "zen", floating = false }]
require_tools = ["windows.state"]

[[case]]
id = "pin-on-every-workspace"
request = "keep the browser on all workspaces"
notes = "Pinning needs a floating window: SONU floats it first."
windows = [{ class = "zen", title = "Zen Browser", workspace = 2 }, { class = "kitty", title = "zsh", workspace = 1, focused = true }]
expect_status = ["done"]
expect_windows = [{ class = "zen", pinned = true }]
require_tools = ["windows.state"]

[[case]]
id = "side-by-side"
request = "put zen and kitty side by side"
windows = [{ class = "zen", title = "Zen Browser", workspace = 2 }, { class = "kitty", title = "zsh", workspace = 1, focused = true }]
expect_status = ["done"]
expect_side_by_side = ["zen", "kitty"]
require_tools = ["windows.side_by_side"]

[[case]]
id = "two-terminals-side-by-side"
request = "put my two terminals next to each other"
windows = [{ class = "kitty", title = "zsh", workspace = 1, focused = true }, { class = "kitty", title = "btop", workspace = 3 }]
expect_status = ["done"]
expect_side_by_side = ["kitty", "kitty"]
require_tools = ["windows.side_by_side"]


# ---- capability batch 2: folders and files, what's playing, reminders (v8)

[[case]]
id = "open-downloads"
request = "open my downloads"
expect_status = ["done"]
expect_windows = [{ class = "Thunar", title_contains = "Downloads" }]
require_tools = ["files.open"]

[[case]]
id = "open-a-project-folder"
request = "open the SONU folder"
notes = "SONU finds ~/dev_works/SONU itself; the model only passes the user's words."
expect_status = ["done"]
expect_windows = [{ class = "Thunar", title_contains = "SONU" }]
require_tools = ["files.open"]

[[case]]
id = "open-last-download"
request = "open my last download"
expect_status = ["done"]
expect_windows = [{ class = "imv", title_contains = "cat.png" }]
require_tools = ["files.open"]
expect_unsupported = false

[[case]]
id = "whats-playing"
request = "what's playing?"
system = { player = "Playing" }
expect_status = ["done"]
require_tools = ["system.status"]
expect_reply_contains = "Media: playing"
forbid_tools = ["media.control", "media.play"]

[[case]]
id = "list-reminders"
request = "what reminders do I have?"
system = { timers = { "sonu-reminder-20260925-180000-abcd" = "check the oven" }, timer_times = { "sonu-reminder-20260925-180000-abcd" = 2026-09-25T18:00:00 } }
expect_status = ["done"]
require_tools = ["reminders.list"]
expect_reply_contains = "check the oven"

[[case]]
id = "cancel-a-reminder"
request = "cancel the oven reminder"
system = { timers = { "sonu-reminder-20260925-180000-abcd" = "check the oven", "sonu-reminder-20260925-190000-beef" = "call mum" }, timer_times = { "sonu-reminder-20260925-180000-abcd" = 2026-09-25T18:00:00, "sonu-reminder-20260925-190000-beef" = 2026-09-25T19:00:00 } }
expect_status = ["done"]
expect_system = { reminders = 1 }
require_tools = ["reminders.cancel"]


